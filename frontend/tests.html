<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Available Tests</title>

    <link rel="stylesheet" href="css/tests.css">
</head>

<body>

    <!-- Header -->
    <header class="header">

        <div class="logo">
            Test Series
        </div>

        <button id="logoutBtn" class="logout-btn">
            Logout
        </button>

    </header>


    <!-- Main Content -->
    <main class="container">

        <!-- Back button -->
        <button id="backBtn" class="back-btn">
            ← Back to Dashboard
        </button>


        <!-- Page heading -->
        <section class="page-heading">

            <h1 id="categoryTitle">
                Available Tests
            </h1>

            <p>
                Select a test to start your examination.
            </p>

        </section>


        <!-- Test Cards -->
        <section>

            <div id="testGrid" class="test-grid">
                <!-- Test cards will be created by JavaScript -->
            </div>

            <p id="message"></p>

        </section>

    </main>


    <script src="js/tests.js"></script>

</body>

</html>
